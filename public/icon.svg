<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="50%" stop-color="#0052CC" />
      <stop offset="100%" stop-color="#003D99" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34C759" />
      <stop offset="100%" stop-color="#30D158" />
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F4F8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#001F52" flood-opacity="0.35"/>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Base background (rounded for standard preview) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Bag Graphic -->
  <g filter="url(#shadow)">
    <!-- Bag Handle -->
    <path d="M196 170 C196 120, 316 120, 316 170" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" />
    
    <!-- Bag Body -->
    <rect x="136" y="170" width="240" height="230" rx="36" fill="url(#bagGrad)" />
    
    <!-- Bag Fold/Accent Line -->
    <path d="M136 210 L376 210" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round" />
    
    <!-- Cashier / Danus lightning / receipt motif inside bag -->
    <path d="M256 240 L236 290 L268 290 L248 340" fill="none" stroke="#0066FF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Green Success / Rupiah Coin Badge -->
  <g filter="url(#badgeShadow)">
    <circle cx="370" cy="360" r="54" fill="url(#glow)" />
    <text x="370" y="375" font-family="-apple-system, system-ui, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle">Rp</text>
  </g>
</svg>