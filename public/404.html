<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <title>POS DANUSAN</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Redirects 404 to the app root maintaining relative directory context
      var isGitHubPages = window.location.hostname.endsWith('github.io');
      var pathSegments = window.location.pathname.split('/').filter(Boolean);
      var targetPath = isGitHubPages && pathSegments.length > 0 ? '/' + pathSegments[0] + '/' : '/';
      window.location.replace(window.location.origin + targetPath + window.location.hash);
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 50px;">Mengalihkan ke POS DANUSAN...</p>
  </body>
</html>
