    <meta name="description" content="Aplikasi POS kasir danusan mobile-first dengan sinkronisasi Google Sheets Apps Script, offline queue, dan dukungan PWA installable." />
    <meta property="og:title" content="POS DANUSAN" />

    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#0066FF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="./manifest.webmanifest" />

  <body class="bg-[#F2F2F7] text-[#1C1C1E] antialiased select-none overscroll-y-none">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Clean, resilient PWA Service Worker Registration
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', function() {
          try {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                var reg = registrations[i];
                if (reg && reg.active && reg.active.scriptURL && reg.active.scriptURL.indexOf('?v=') !== -1) {
                  reg.unregister();
                }
              }
            }).catch(function() {});

            navigator.serviceWorker.register('./sw.js')
              .catch(function(err) {
                console.warn('PWA SW note:', err);
              });
          } catch (e) {
            console.warn('PWA setup note:', e);
          }
        });
      }
    </script>
  </body>
</html>
